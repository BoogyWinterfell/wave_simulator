<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave & Signal Simulator</title>

    <!-- Trunk configuration: targets src/bin/gui.rs and optimizes WASM size -->
    <link data-trunk rel="rust" data-bin="gui" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1b1b1b;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="wave_canvas"></canvas>
</body>
</html>
